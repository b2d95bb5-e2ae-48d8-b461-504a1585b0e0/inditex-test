name: CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      docker:
        image: docker:26.1-dind
        privileged: true

    steps:
      # -----------------------------
      # CHECKOUT SOURCE CODE
      # -----------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------
      # SETUP JDK
      # -----------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # -----------------------------
      # RUN UNIT + INTEGRATION TESTS
      # -----------------------------
      - name: Run Maven tests
        run: mvn -B clean verify

      # -----------------------------
      # SET UP NODE + NEWMAN FOR POSTMAN E2E
      # -----------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Newman
        run: npm install -g newman newman-reporter-htmlextra

      # -----------------------------
      # START THE APPLICATION
      # -----------------------------
      - name: Build Docker Image
        run: docker build -t similarproducts-app .

      - name: Run Application Container
        run: |
          docker run -d \
            --name similarproducts-container \
            -p 5000:5000 \
            similarproducts-app

      - name: Wait for application startup
        run: |
          echo "Waiting for app to start..."
          for i in {1..30}; do
            if curl -s http://localhost:5000/product/1/similar > /dev/null; then
              echo "API is up!"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done

      # -----------------------------
      # RUN POSTMAN E2E TESTS
      # -----------------------------
      - name: Run Postman tests with Newman
        run: |
          newman run shared/postman/similarproducts.postman_collection.json \
            --env-var baseUrl=http://localhost:5000 \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export ./newman-report.html

      # -----------------------------
      # UPLOAD REPORT ARTIFACTS
      # -----------------------------
      - name: Upload Newman report
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: newman-report.html
